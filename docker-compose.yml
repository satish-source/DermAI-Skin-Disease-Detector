version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dermai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/dermai.db
    volumes:
      - dermai-data:/app/data
      - dermai-uploads:/app/uploads
      - dermai-processed:/app/processed
      - dermai-reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dermai-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dermai-data:
  dermai-uploads:
  dermai-processed:
  dermai-reports:

