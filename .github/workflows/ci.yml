name: DermAI CI/CD & Model Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Backend Test Suite & ML Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install CPU PyTorch & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r backend/requirements.txt
        pip install flake8 pytest

    - name: Lint Code with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Core Integration Test Suite
      env:
        PYTHONPATH: backend
      run: |
        python backend/tests/test_pipeline.py

    - name: Run Fitzpatrick Demographic Fairness Audit
      env:
        PYTHONPATH: backend
      run: |
        python backend/evaluate_fairness.py

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Validate Docker Compose Configuration
      run: |
        docker compose config

    - name: Build Backend Docker Image
      run: |
        docker build -f Dockerfile.backend -t dermai-backend:ci .

    - name: Build Frontend Docker Image
      run: |
        docker build -f Dockerfile.frontend -t dermai-frontend:ci .
